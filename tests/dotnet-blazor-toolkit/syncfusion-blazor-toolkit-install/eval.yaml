name: syncfusion-blazor-toolkit-install
description: >
  Evaluation scenarios for Syncfusion Blazor Toolkit installation and configuration skill.
  Tests cover successful installations on Server, WebAssembly, and split Web App projects,
  plus failure scenarios for missing CSS, missing service registration, static SSR limitations,
  wrong commercial packages, split app partial registration, and out-of-scope component API requests.

defaults:
  max_tokens: 2000
  temperature: 0.7

stimuli:
  - name: server-install-success
    type: text
    content: |
      I'm setting up a new Blazor Server project. I want to install the Syncfusion Blazor Toolkit.
      What are the steps I need to follow to get it working?
    
    expectations:
      - type: contains
        text: "Syncfusion.Blazor.Toolkit"
        reason: "Must recommend the exact Toolkit package name, not commercial packages"
      - type: contains
        text: "AddSyncfusionBlazorToolkit"
        reason: "Must document service registration method"
      - type: contains
        text: "_Imports.razor"
        reason: "Must document namespace import step"
      - type: contains
        text: "theme"
        reason: "Must document theme CSS linking"
      - type: contains
        text: "App.razor"
        reason: "For Blazor Server, theme link goes in App.razor"
      - type: not_contains
        text: "Syncfusion.Blazor.Buttons"
        reason: "Must not recommend commercial component packages as alternative"
      - type: not_contains
        text: "license key"
        reason: "Toolkit does not require license keys"
      - type: not_contains
        text: "AddSyncfusionLicense"
        reason: "Toolkit registration is AddSyncfusionBlazorToolkit, not license-based"

  - name: webassembly-install-success
    type: text
    content: |
      I'm building a Blazor WebAssembly application and want to add the Syncfusion Blazor Toolkit.
      Can you guide me through installation and setup?
    
    expectations:
      - type: contains
        text: "Syncfusion.Blazor.Toolkit"
        reason: "Must recommend the Toolkit package"
      - type: contains
        text: "AddSyncfusionBlazorToolkit"
        reason: "Must document service registration in WASM Program.cs"
      - type: contains
        text: "index.html"
        reason: "For Blazor WebAssembly, theme links in index.html"
      - type: contains
        text: "@using Syncfusion.Blazor"
        reason: "Must document namespace import"
      - type: not_contains
        text: "App.razor"
        reason: "App.razor is not the host file for WASM; index.html is"
      - type: not_contains
        text: "license"
        reason: "Toolkit does not require licensing"

  - name: split-webapp-registration
    type: text
    content: |
      We have a split Blazor Web App with Server and Client projects. Both Server and Client
      components need to use the Syncfusion Blazor Toolkit. What configuration is required?
    
    expectations:
      - type: contains
        text: "AddSyncfusionBlazorToolkit"
        reason: "Must recommend registration"
      - type: contains
        text: "Server"
        reason: "Must mention Server project needs registration"
      - type: contains
        text: "Client"
        reason: "Must mention Client project needs registration"
      - type: contains
        text: "both"
        reason: "Must clarify that BOTH projects need registration if both use Toolkit"
      - type: not_contains
        text: "only the Server"
        reason: "Must not say registration is only needed in Server for split Web App"
      - type: not_contains
        text: "only the Client"
        reason: "Must not say registration is only needed in Client for split Web App"

  - name: missing-theme-css-failure
    type: text
    content: |
      I've installed the Syncfusion Blazor Toolkit and added AddSyncfusionBlazorToolkit()
      to Program.cs, but my components render without any styling—they look plain and basic.
      The components are there, but no colors or borders. What's wrong?
    
    expectations:
      - type: contains
        text: "theme CSS"
        reason: "Must identify missing CSS as the root cause"
      - type: contains
        text: "link"
        reason: "Must mention adding a link to theme CSS"
      - type: contains
        text: "_content/Syncfusion.Blazor.Toolkit/themes"
        reason: "Must provide the correct theme path"
      - type: contains
        text: "App.razor"
        reason: "If Server, theme goes in App.razor; if WASM, index.html"
      - type: not_contains
        text: "install a different package"
        reason: "Wrong package is not the diagnosis for unstyled components"
      - type: not_contains
        text: "buy a commercial license"
        reason: "Must not suggest purchasing a commercial license to fix styling"

  - name: static-ssr-insufficient
    type: text
    content: |
      I have a Blazor Web App with a SfButton component from the Syncfusion Blazor Toolkit.
      When I click the button, nothing happens. The component is visible and styled correctly,
      but events don't fire. What's the issue?
    
    expectations:
      - type: contains
        text: "@rendermode"
        reason: "Must diagnose that static SSR is insufficient"
      - type: contains
        text: "InteractiveServer"
        reason: "Must suggest using an interactive render mode"
      - type: contains
        text: "InteractiveWebAssembly"
        reason: "Must mention WebAssembly as an alternative interactive mode"
      - type: contains
        text: "static"
        reason: "Must explain why static SSR alone doesn't work for interactive components"
      - type: not_contains
        text: "static SSR is sufficient"
        reason: "Must not claim static SSR alone is enough for interactive Toolkit components"
      - type: not_contains
        text: "downgrade the package"
        reason: "Wrong package is not the issue; render mode is"

  - name: wrong-commercial-package
    type: text
    content: |
      I ran `dotnet add package Syncfusion.Blazor` and now I'm seeing references to AddSyncfusionLicense()
      and license keys. I need to use the open-source Toolkit for a hobby project. Did I install the
      wrong package?
    
    expectations:
      - type: contains
        text: "Syncfusion.Blazor.Toolkit"
        reason: "Must identify the correct package name"
      - type: contains
        text: "Syncfusion.Blazor"
        reason: "Must clarify the difference between commercial Syncfusion.Blazor and Toolkit"
      - type: contains
        text: "remove"
        reason: "Must advise removing the wrong commercial package"
      - type: contains
        text: "dotnet remove package"
        reason: "Must show the command to uninstall the commercial package"
      - type: contains
        text: "AddSyncfusionBlazorToolkit"
        reason: "Must document the correct registration method for Toolkit"
      - type: not_contains
        text: "license key"
        reason: "Toolkit does not use license keys; must redirect away from licensing"

  - name: split-app-partial-registration-failure
    type: text
    content: |
      I have a split Blazor Web App. I added the Syncfusion Blazor Toolkit package and registered
      it with AddSyncfusionBlazorToolkit() in the Server Program.cs. My Server components work fine,
      but Client components throw errors. Both halves need Toolkit. What's missing?
    
    expectations:
      - type: contains
        text: "Client Program.cs"
        reason: "Must identify that Client registration is missing"
      - type: contains
        text: "AddSyncfusionBlazorToolkit"
        reason: "Must show the registration call needed in Client"
      - type: contains
        text: "both"
        reason: "Must clarify that split Web App needs registration in both projects"
      - type: not_contains
        text: "only Server needs registration"
        reason: "Must not say registration is needed in only one project for split Web App"

  - name: script-failure-or-js-error
    type: text
    content: |
      I installed Syncfusion Blazor Toolkit and configured everything, but now the browser console
      shows JavaScript errors like "undefined is not a function" related to Syncfusion. The components
      are on the page but they don't respond to clicks. What's wrong?
    
    expectations:
      - type: contains
        text: "JavaScript"
        reason: "Must diagnose as a JavaScript loading or service registration issue"
      - type: contains
        text: "AddSyncfusionBlazorToolkit"
        reason: "Must verify service registration was called"
      - type: contains
        text: "Program.cs"
        reason: "Must check that services are registered in Program.cs"
      - type: contains
        text: "browser console"
        reason: "Must suggest checking browser DevTools console for errors"
      - type: contains
        text: "clear cache"
        reason: "Must suggest clearing browser cache and rebuilding"
      - type: not_contains
        text: "different package"
        reason: "Package is likely correct; issue is registration or JS loading"
      - type: not_contains
        text: "downgrade"
        reason: "Wrong package or version is not the diagnosis"

  - name: wrong-theme-name-failure
    type: text
    content: |
      I linked the Syncfusion Blazor Toolkit theme CSS in my App.razor like this:
      <link href="_content/Syncfusion.Blazor.Toolkit/themes/bootstrap5.css" rel="stylesheet" />
      
      The components render but they're completely unstyled. Browser DevTools shows no 404 errors on the CSS.
      What's the issue?
    
    expectations:
      - type: contains
        text: "fluent"
        reason: "Must identify that only Fluent theme is supported"
      - type: contains
        text: "fluent.min.css"
        reason: "Must recommend the correct filename with .min extension"
      - type: not_contains
        text: "bootstrap5"
        reason: "Must not suggest using bootstrap5 theme; it's not supported for Toolkit"
      - type: not_contains
        text: "tailwind"
        reason: "Must not suggest tailwind theme; it's not supported for Toolkit"

  - name: wrong-stylesheet-path-failure
    type: text
    content: |
      I'm getting 404 errors for the Toolkit theme CSS file. I'm using this path:
      <link href="_content/Syncfusion.Blazor.Toolkit/themes/fluent.css" rel="stylesheet" />
      
      The browser DevTools Network tab shows a 404. What's the correct path?
    
    expectations:
      - type: contains
        text: "styles"
        reason: "Must identify the correct directory: styles/ not themes/"
      - type: contains
        text: "fluent.min.css"
        reason: "Must recommend the correct filename with .min extension"
      - type: contains
        text: "_content/Syncfusion.Blazor.Toolkit/styles/"
        reason: "Must provide the exact correct path"
      - type: not_contains
        text: "themes/"
        reason: "Must not recommend the themes/ directory; the correct one is styles/"

  - name: script-file-loading-failure
    type: text
    content: |
      I've installed the Syncfusion Blazor Toolkit and added all the configuration. The browser
      DevTools shows JavaScript errors like "Cannot read property of undefined" when I interact
      with components. I can see 404 errors in the Network tab for files in _content/Syncfusion.Blazor.Toolkit/.
      What's the issue?
    
    expectations:
      - type: contains
        text: "script"
        reason: "Must diagnose as a script loading issue"
      - type: contains
        text: "_content"
        reason: "Must acknowledge the 404 errors for static web assets"
      - type: contains
        text: "AddSyncfusionBlazorToolkit"
        reason: "Must verify service registration in Program.cs"
      - type: contains
        text: "Program.cs"
        reason: "Must check that services are registered before Build()"
      - type: contains
        text: "clean"
        reason: "Must suggest rebuilding (dotnet clean) to resolve asset loading issues"
      - type: contains
        text: "package"
        reason: "Must verify the package is installed correctly"
      - type: not_contains
        text: "wrong package"
        reason: "If 404s are showing, package is installed; issue is configuration"
      - type: not_contains
        text: "material.css"
        reason: "Must not suggest material theme; it's not supported for Toolkit"
      - type: contains
        text: "only"
        reason: "Must emphasize that Toolkit supports ONLY the Fluent theme"

  - name: out-of-scope-component-api
    type: text
    content: |
      I'm building a chart dashboard with the Syncfusion Blazor Toolkit. How do I configure
      the series collection for a line chart? What are the available series types?
    
    expects_activation: false
    expectations:
      - type: not_contains
        text: "series"
        reason: "Should not answer component API questions (series configuration)"
      - type: not_contains
        text: "LineSeriesType"
        reason: "Should not provide component-specific enum values"
      - type: contains_any
        text:
          - "out of scope"
          - "not cover"
          - "component API"
          - "installation"
        reason: "Should politely decline or redirect to installation/setup scope"

stimuli_priority:
  - server-install-success
  - webassembly-install-success
  - split-webapp-registration
  - missing-theme-css-failure
  - static-ssr-insufficient
  - wrong-commercial-package
  - split-app-partial-registration-failure
  - script-failure-or-js-error
  - wrong-theme-name-failure
  - wrong-stylesheet-path-failure
  - script-file-loading-failure
  - out-of-scope-component-api

graders:
  - name: contains
    type: string_matcher
    params:
      case_sensitive: false
      partial: true

  - name: not_contains
    type: string_matcher
    params:
      case_sensitive: false
      partial: true
      negate: true

  - name: contains_any
    type: choice_matcher
    params:
      case_sensitive: false
      partial: true

  - name: substring_count
    type: count_matcher
    params:
      substring: true
      case_sensitive: false

validators:
  - name: package-identity
    description: "Verify correct package name is used"
    assertions:
      - grader: contains
        text: "Syncfusion.Blazor.Toolkit"
      - grader: not_contains
        text: "Syncfusion.Blazor.Buttons"

  - name: service-registration
    description: "Verify service registration is documented"
    assertions:
      - grader: contains
        text: "AddSyncfusionBlazorToolkit"

  - name: no-commercial-licensing
    description: "Verify no commercial license guidance for Toolkit"
    assertions:
      - grader: not_contains
        text: "license key"

  - name: render-mode-for-interactivity
    description: "Verify render mode is explained for interactive components"
    assertions:
      - grader: contains
        text: "@rendermode"

  - name: theme-css-required
    description: "Verify theme CSS linking is documented"
    assertions:
      - grader: contains
        text: "theme"

  - name: fluent-theme-only
    description: "Verify only Fluent theme is recommended"
    assertions:
      - grader: contains
        text: "fluent"
      - grader: not_contains
        text: "bootstrap"

  - name: correct-stylesheet-path
    description: "Verify correct path _content/Syncfusion.Blazor.Toolkit/styles/"
    assertions:
      - grader: contains
        text: "_content/Syncfusion.Blazor.Toolkit/styles/"
      - grader: not_contains
        text: "themes/"

  - name: correct-stylesheet-filename
    description: "Verify .min.css extension is used"
    assertions:
      - grader: contains
        text: "fluent.min.css"

  - name: script-loading-diagnosis
    description: "Verify script loading failures are diagnosed correctly"
    assertions:
      - grader: contains
        text: "script"
      - grader: contains
        text: "AddSyncfusionBlazorToolkit"
      - grader: contains
        text: "Program.cs"
