name: configure-auth
description: Evaluates the dotnet-blazor/configure-auth skill
type: capability
defaults:
  timeout: 20m
stimuli:
  - name: Login and account management in a globally interactive app
    tags:
      capability: configure-auth
      risk: baseline-misses-configure-auth-guidance
      journey: login-and-account-management-in-a-globally-inter
    prompt: |
      I have a Blazor Web App with Interactive Server mode applied globally
      (all pages are interactive by default).

      I need to add ASP.NET Core Identity-based authentication. Here's where
      I'm stuck:

      1. I need a /account/login page with email/password that calls
         SignInManager.PasswordSignInAsync. But when I try to use SignInManager
         in my interactive page, I get an error about HttpContext not being
         available. The whole app is globally interactive — how do I make
         login work?

      2. Same problem for /account/register using UserManager.CreateAsync —
         it also needs HttpContext for cookie authentication.

      3. After login, the user should be redirected to / (homepage). After
         registration, redirect to login. Both pages need proper form
         validation (required fields, email format).

      4. I also need a /account/logout endpoint that signs out. But wait —
         signing out also needs HttpContext... same problem again?

      5. Add a "Logged in as {email} | Logout" display in the nav when
         authenticated, and "Login | Register" links when not.

      6. The rest of the app must stay fully interactive — I don't want to
         lose global interactivity for my normal pages just because auth
         pages have special needs.

      Set up Identity services in Program.cs with an in-memory EF store.
      I don't need user seeding — just the pages and plumbing.
    environment:
      commands:
        - dotnet new blazor --interactivity server --all-interactive --no-https --force
    graders:
      - type: file-contains
        config:
          path: '**/*ogin*'
          value: ExcludeFromInteractiveRouting
      - type: file-contains
        config:
          path: '**/App.razor'
          value: AcceptsInteractiveRouting
      - type: file-contains
        config:
          path: '**/*ogin*'
          value: SignInManager
      - type: prompt
    rubric:
      - Login and register pages use [ExcludeFromInteractiveRouting] to render as static SSR — explains that SignInManager and UserManager need HttpContext which is unavailable in interactive components
      - App.razor conditionally applies the render mode using HttpContext.AcceptsInteractiveRouting() — returns null for excluded pages and InteractiveServer for everything else
      - Identity services are registered in Program.cs (AddIdentity or AddIdentityCore with AddEntityFrameworkStores and AddSignInManager) and authentication middleware is added
      - Logout is handled correctly (either a static page or a minimal API endpoint) — does not attempt HttpContext operations inside an interactive component
      - Auth state is reflected in the UI — shows user info when logged in, login/register links when not
  - name: Multi-tier app with WebAssembly auth
    tags:
      capability: configure-auth
      risk: baseline-misses-configure-auth-guidance
      journey: multi-tier-app-with-webassembly-auth
    prompt: |
      I have a Blazor Web App using Auto interactivity mode (per-page). Some
      pages will run on Server, others on WebAssembly.

      I need to add authentication that works across both render modes:

      1. Create a custom AuthenticationStateProvider on the server that
         simulates a logged-in user "bob@example.com" with roles "User" and
         "Editor". No real database needed — just hardcode the claims.

      2. A /profile page (interactive, any mode) that displays the authenticated
         user's name and all their roles. It should work regardless of whether
         it's currently running on Server or WebAssembly.

      3. A /editor page (interactive, any mode) restricted to the "Editor" role.
         Show an "Access denied" message for users without the role.

      4. A /viewer page (interactive, any mode) accessible to any authenticated
         user.

      The key requirement: after the page initially loads and the WebAssembly
      runtime takes over, the user's identity and roles must still be available.
      I've heard that auth state can get lost when the client-side runtime
      activates — make sure that doesn't happen.
    environment:
      commands:
        - dotnet new blazor --interactivity auto --no-https --force
    graders:
      - type: file-contains
        config:
          path: '**/Program.cs'
          value: AddAuthenticationStateSerialization
      - type: file-contains
        config:
          path: '**/*.razor'
          value: '[Authorize'
      - type: prompt
    rubric:
      - Server Program.cs calls AddAuthenticationStateSerialization so auth state is serialized into the prerendered HTML — without this the WebAssembly runtime starts with an anonymous user
      - Client Program.cs calls AddAuthenticationStateDeserialization so the WASM runtime can reconstitute the auth state from the serialized data
      - Profile page displays user name and roles that remain correct after WebAssembly takes over from prerendering — the auth state is not lost during the handoff
      - Editor page enforces role-based access via [Authorize(Roles = ...)] or AuthorizeView with Roles — unauthorized users see a denied message, not the page content
  - name: Policy-based access for a library staff area
    tags:
      capability: configure-auth
      risk: baseline-misses-configure-auth-guidance
      journey: policy-based-access-for-a-library-staff-area
    prompt: |
      I have a Blazor Web App with Interactive Server set per page (only pages
      that declare a render mode are interactive). It currently has no
      authentication wiring at all. I'll plug in the real sign-in later; for now
      I just need the authorization side set up for a library catalog.

      1. Define a policy "CanManageCatalog" that requires a claim "staff-level"
         with the value "librarian" or "head-librarian".
      2. A /catalog/manage page (interactive) must only be reachable when that
         policy is satisfied. Anonymous visitors should be sent to a
         /sign-in page; signed-in users who lack the policy should see a short
         "not permitted" message instead of the page.
      3. On the home page, show a "Manage catalog" link only to users who meet
         the policy.
      4. Add a small component that checks in C# code whether the current user
         has the "staff-level" claim, and shows the claim value.

      Make sure the router and services are set up so all of this actually
      works.
    environment:
      commands:
        - dotnet new blazor --interactivity server --no-https --force
    graders:
      - type: file-contains
        config:
          path: '**/Program.cs'
          value: CanManageCatalog
      - type: file-contains
        config:
          path: '**/Program.cs'
          value: AddCascadingAuthenticationState
      - type: file-contains
        config:
          path: '**/*.razor'
          value: AuthorizeRouteView
      - type: file-contains
        config:
          path: '**/*.razor'
          value: Policy = "CanManageCatalog"
      - type: file-contains
        config:
          path: '**/*.razor'
          value: Task<AuthenticationState>
      - type: prompt
    rubric:
      - The policy is registered with the authorization services (AddAuthorization or AddAuthorizationBuilder with AddPolicy and a claim requirement accepting both values)
      - The manage page is protected with an [Authorize] attribute that references the policy, and the router uses a route view that honors authorization with distinct handling for anonymous and signed-in-but-denied users
      - The home page link is conditionally rendered via an AuthorizeView that references the policy
      - The C# check reads the user from the cascaded Task<AuthenticationState> rather than from HttpContext, and cascading authentication state is registered in Program.cs
  - name: Access-denied content never appears on a static page
    tags:
      capability: configure-auth
      risk: baseline-misses-configure-auth-guidance
      journey: access-denied-content-never-appears-on-a-static
    prompt: |
      My Blazor Web App renders most pages as plain static server-side rendering
      (no render mode on them). I have a /reports page with `@attribute
      [Authorize(Roles = "Auditor")]` and the router has an AuthorizeRouteView
      with a <NotAuthorized> block that shows "You need the Auditor role".

      When I'm logged in as a user without that role and browse to /reports, I
      never see my custom message. Instead I get bounced to a default
      /Account/AccessDenied URL that 404s. The same page works as I expected
      when I make it interactive.

      Why is this happening, and what should I change so that anonymous users
      go to my login page and users without the role see a proper message?
      Please explain and show the code I need.
    environment:
      commands:
        - dotnet new blazor --interactivity none --no-https --force
    graders:
      - type: output-matches
        config:
          pattern: (?i)(middleware|authentication scheme|cookie|AccessDeniedPath|LoginPath|status ?code ?page|UseStatusCodePages)
      - type: output-matches
        config:
          pattern: (?i)(static|SSR|not interactive|no circuit)
      - type: prompt
    rubric:
      - Explains that in static SSR the authorization failure is handled by the ASP.NET Core authentication/authorization pipeline (challenge/forbid via the configured scheme), not by the router's NotAuthorized content
      - Gives a concrete fix such as configuring LoginPath and AccessDeniedPath on the cookie options (and creating an access-denied page), or a redirect component or status-code handling that shows the custom message
      - Distinguishes the behavior from interactive rendering, where the router's NotAuthorized content does render
      - Does not recommend making every page interactive just to see the message
  - name: User identity is empty inside an interactive component
    tags:
      capability: configure-auth
      risk: baseline-misses-configure-auth-guidance
      journey: user-identity-is-empty-inside-an-interactive-com
    prompt: |
      In my Blazor Web App (Interactive Server on all pages) I wrote this
      component to show who is logged in:

      ```razor
      @inject IHttpContextAccessor Accessor

      <p>Hello, @Accessor.HttpContext?.User.Identity?.Name</p>
      ```

      It shows the right name on the first load, but after I navigate around
      inside the app the name is blank, and in some cases it throws a null
      reference. I register AddHttpContextAccessor in Program.cs. Login works
      and cookies are present.

      What is wrong with this approach and what is the correct way to get the
      current user in this component? Show a corrected version.
    environment:
      commands:
        - dotnet new blazor --interactivity server --all-interactive --no-https --force
    graders:
      - type: output-contains
        config:
          substring: AuthenticationState
      - type: output-matches
        config:
          pattern: (?i)(CascadingParameter|AuthenticationStateProvider|AuthorizeView)
      - type: output-matches
        config:
          pattern: (?i)(circuit|websocket|SignalR)
      - type: prompt
    rubric:
      - Explains that after the initial request an interactive Server component runs over a long-lived circuit where the original HttpContext is not available or reliable, so reading the user from it gives null or stale results
      - Fixes it by obtaining the user from authentication state (a cascaded Task<AuthenticationState>, AuthenticationStateProvider, or AuthorizeView), awaiting it before reading User
      - Mentions that cascading authentication state must be registered (AddCascadingAuthenticationState) or the cascaded value will be null
      - The corrected component handles the anonymous case without throwing
