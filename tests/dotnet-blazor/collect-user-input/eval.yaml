name: collect-user-input
description: Evaluates the dotnet-blazor/collect-user-input skill
type: capability
defaults:
  timeout: 15m
stimuli:
  - name: Event registration with custom validation
    tags:
      capability: collect-user-input
      risk: baseline-misses-collect-user-input-guidance
      journey: event-registration-with-custom-validation
    prompt: |
      I have an existing Blazor Web App with Interactive Server (per-page).

      I need an interactive /register page for event registration:
      - Attendee name (required)
      - Email (required, valid email)
      - Number of guests (0-5)
      - Preferred session (Morning, Afternoon, Evening)
      - Special dietary requirements (free text, optional)

      Here's the catch: after the user fills everything in and clicks Register,
      I need to check with the server whether that email is already registered
      for this event. If it is, show an error message on the email field saying
      "This email is already registered" — not a generic error, but a field-specific
      error that appears right next to the email input. The user should be able to
      change the email and try again.

      Create a RegistrationService with a stub ValidateAsync method that returns
      field-specific errors (simulate the email already being registered for a
      hardcoded test email like "taken@example.com").
    environment:
      commands:
        - dotnet new blazor --interactivity server --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/Register.razor'
      - type: file-contains
        config:
          path: '**/Register.razor'
          value: EditForm
      - type: file-contains
        config:
          path: '**/Register.razor'
          value: ValidationMessage
      - type: file-contains
        config:
          path: '**/Register.razor'
          value: DataAnnotationsValidator
      - type: prompt
    rubric:
      - Uses a custom validator component (or ValidationMessageStore directly) to display server-returned field-specific errors — the email duplicate error appears next to the email field via ValidationMessage, not as a generic message
      - Model uses data annotation attributes for basic validation (Required, EmailAddress, Range) with DataAnnotationsValidator
      - Submit handler calls the registration service, checks for server-returned errors, and displays them on the correct fields without losing the user's input
      - The form lets the user correct the email and resubmit — errors clear when the field changes
      - Uses InputText, InputNumber, InputSelect or InputRadioGroup for the respective fields
  - name: Multi-step booking form with cross-field validation
    tags:
      capability: collect-user-input
      risk: baseline-misses-collect-user-input-guidance
      journey: multi-step-booking-form-with-cross-field-validat
    prompt: |
      I have a Blazor Web App with per-page interactivity (Server mode).

      I need a /book-appointment page for scheduling medical appointments.
      The form has two steps on the same page (not separate routes):

      STEP 1 (always visible):
      - Patient name (required)
      - Email (required, valid format)
      - Phone (required)
      - Insurance provider (dropdown: Aetna, BlueCross, Cigna, UnitedHealth, None)

      STEP 2 (appears after step 1 validation passes):
      - Preferred doctor (dropdown: loaded from an AppointmentService)
      - Date (required, must be in the future)
      - Time slot (dropdown: available slots from AppointmentService based on doctor + date)
      - Reason for visit (required, max 500 chars)

      When the user clicks "Check Availability" between steps, call
      AppointmentService.ValidatePatientAsync which checks server-side rules:
      - If the email belongs to a patient with an outstanding balance, return
        an error on the Email field: "Account has outstanding balance"
      - If the insurance provider is "None" and the selected doctor doesn't
        accept self-pay, return an error on the Doctor field: "Selected doctor
        does not accept self-pay patients"
      - If the selected time slot was just taken (race condition), return an
        error on the TimeSlot field: "This slot is no longer available"

      These server errors must appear next to the specific fields — not as
      a generic error banner. The user should be able to correct the field
      and try again without losing other form data.

      Create stub AppointmentService that simulates these validations:
      reject "taken@example.com" for balance, reject "None" insurance
      with doctor "Dr. Smith", and reject timeslot "10:00 AM" as taken.

      Make this page interactive with @rendermode InteractiveServer.
    environment:
      commands:
        - dotnet new blazor --interactivity server --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/BookAppointment.razor'
      - type: file-contains
        config:
          path: '**/BookAppointment.razor'
          value: EditForm
      - type: file-contains
        config:
          path: '**/BookAppointment.razor'
          value: ValidationMessage
      - type: prompt
    rubric:
      - Server-returned errors appear next to the specific field via ValidationMessage — uses ValidationMessageStore or equivalent to add field-level errors from the service response, not manual conditional divs
      - After server validation failure, the user can change the flagged field and resubmit — errors clear on the relevant field without losing other form data
      - Uses data annotation attributes for client-side validation (Required, EmailAddress, MaxLength, custom date validator) with DataAnnotationsValidator
      - Multi-step progression — step 2 fields only appear after step 1 validates successfully, providing progressive disclosure
      - Time slots load dynamically based on doctor and date selection — cascading dropdown behavior within the form
  - name: Static contact form with posted model
    tags:
      capability: collect-user-input
      risk: baseline-misses-collect-user-input-guidance
      journey: static-contact-form-with-posted-model
    prompt: |
      I have a Blazor Web App created with no interactivity at all (everything is
      static server rendering, global scope).

      Add a /support-ticket page where a customer can open a support ticket:
      - Subject (required, up to 80 characters)
      - Severity rating from 1 to 5
      - Description (required)

      The page must work with plain HTML form posts only. After a valid submit,
      show a "Ticket received" confirmation line on the same page. I'd like the
      submit to feel smooth, without a full page reload if possible, and the
      form must display validation messages when fields are bad.
    environment:
      commands:
        - dotnet new blazor --interactivity none --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/SupportTicket.razor'
      - type: file-contains
        config:
          path: '**/SupportTicket.razor'
          value: SupplyParameterFromForm
      - type: file-contains
        config:
          path: '**/SupportTicket.razor'
          value: FormName
      - type: file-contains
        config:
          path: '**/SupportTicket.razor'
          value: Enhance
      - type: file-contains
        config:
          path: '**/SupportTicket.razor'
          value: DataAnnotationsValidator
      - type: file-contains
        config:
          path: '**/*.{razor,cs}'
          value: Range(
      - type: file-contains
        config:
          path: '**/*.{razor,cs}'
          value: Required
      - type: prompt
    rubric:
      - The page does not add a render mode and does not rely on interactive-only features such as @bind-Value, @oninput or @onclick handlers for the form
      - The posted model is bound from the form post and is initialized when null so it works on both the initial GET and the POST
      - Severity is limited to 1-5 and subject length is capped using validation attributes, and validation errors are displayed
      - The form opts into enhanced form handling so the submit does not require a full page reload, and the confirmation is shown after a valid submit
  - name: Plain HTML newsletter form in static rendering
    tags:
      capability: collect-user-input
      risk: baseline-misses-collect-user-input-guidance
      journey: plain-html-newsletter-form-in-static-rendering
    prompt: |
      My Blazor Web App has no interactivity configured; every page is statically
      rendered. I don't want to use EditForm or any model-binding components here.

      Add a /newsletter page with a hand-written HTML <form> that posts an email
      address and a "frequency" choice (daily or weekly). When the post arrives,
      display "Subscribed: <email>" under the form. A page elsewhere in the app
      already has another form, so this one must be identifiable on its own.
      The server must accept the post without antiforgery rejections.
    environment:
      commands:
        - dotnet new blazor --interactivity none --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/Newsletter.razor'
      - type: file-contains
        config:
          path: '**/Newsletter.razor'
          value: AntiforgeryToken
      - type: file-contains
        config:
          path: '**/Newsletter.razor'
          value: SupplyParameterFromForm
      - type: file-contains
        config:
          path: '**/Newsletter.razor'
          value: <form
      - type: output-not-matches
        config:
          pattern: '(?i)\bI (did not|didn''t) (create|add) '
      - type: prompt
    rubric:
      - Uses a raw form element with method post, a form name attribute (formname or equivalent), and an antiforgery token inside the form
      - Reads the posted values via SupplyParameterFromForm properties or an equivalent form-post binding, with the field names in the markup matching the bound property names
      - Does not use @bind or @oninput, which need interactivity, and does not add a render mode
      - Handles the initial GET gracefully when no posted value exists, showing the confirmation only after a post
  - name: Avatar upload with custom validation attribute
    tags:
      capability: collect-user-input
      risk: baseline-misses-collect-user-input-guidance
      journey: avatar-upload-with-custom-validation-attribute
    prompt: |
      I have a Blazor Web App with Interactive Server enabled globally.

      Build an /profile-photo page where a user picks an image of their face to
      upload, plus a "display handle" text box. The handle must be a custom
      rule: lowercase letters and digits only, and it must not be one of a
      reserved list (admin, root, support). Show the rule violation next to the
      handle field. Images can be up to 2 MB and only png or jpg; save the
      accepted file to a local "uploads" folder under the app content root and
      report the saved file name on the page. Reject larger files with a visible
      message instead of crashing the circuit.
    environment:
      commands:
        - dotnet new blazor --interactivity server --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/ProfilePhoto.razor'
      - type: file-contains
        config:
          path: '**/ProfilePhoto.razor'
          value: InputFile
      - type: file-contains
        config:
          path: '**/ProfilePhoto.razor'
          value: OpenReadStream
      - type: file-contains
        config:
          path: '**/*.{razor,cs}'
          value: ValidationAttribute
      - type: file-contains
        config:
          path: '**/*.{razor,cs}'
          value: IsValid
      - type: file-contains
        config:
          path: '**/ProfilePhoto.razor'
          value: DataAnnotationsValidator
      - type: prompt
    rubric:
      - The handle rule is a class deriving from ValidationAttribute (or implementing IValidatableObject) applied to the model property, and its error appears through ValidationMessage or ValidationSummary
      - File upload uses InputFile with an OnChange handler, and OpenReadStream is given an explicit maximum size of 2 MB rather than relying on the 500 KB default
      - Oversized or wrong-type files produce a user-visible message and the exception is caught or the size and type are checked before reading
      - The saved file name is generated safely (not trusting the client-supplied name for the path) and the page reports the result
      - The page is interactive (the project is Interactive Server) and does not need FormName-only static SSR workarounds
