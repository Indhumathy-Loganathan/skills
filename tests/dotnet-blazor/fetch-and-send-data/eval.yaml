name: fetch-and-send-data
description: Evaluates the dotnet-blazor/fetch-and-send-data skill
type: capability
defaults:
  timeout: 15m
stimuli:
  - name: Recipe browser with resilient data loading
    tags:
      capability: fetch-and-send-data
      risk: baseline-misses-fetch-and-send-data-guidance
      journey: recipe-browser-with-resilient-data-loading
    prompt: |
      I have a Blazor Web App with Interactive Server (per-page).

      I need an interactive /recipes/{CuisineId:int} page that calls a
      backend service to fetch and display recipe data for a given cuisine.
      It also accepts a ?sort= query parameter (newest or popular) that only
      controls display order.

      Create a RecipeService with a GetByCuisineAsync(int cuisineId,
      CancellationToken cancellationToken) method that simulates a slow API
      call (Task.Delay(2000, cancellationToken)) and returns a list of
      recipes (Id, Title, Description, PrepTimeMinutes). Seed data for 3
      cuisines.

      The data fetching should handle the full async lifecycle correctly —
      here are the specific behaviors I need:

      1. If the user picks a different cuisine while the current one is still
         loading, stop loading the current cuisine and start loading the new one.
         Changing only the sort parameter should not trigger a data reload.

      2. The first time the page loads (no data yet), show a loading placeholder.
         When navigating to a different cuisine after data is already on screen,
         keep the existing recipes visible and show a small "Refreshing…" indicator.
         When the new data arrives, swap it in and hide the indicator.

      3. If something goes wrong — timeout, network error, whatever — show
         the user a friendly message and a Retry button so they can try again.
         If it's a timeout specifically, say so. Never show raw exception
         details to the user — log errors properly through ILogger.

      4. If the user navigates away from the page, all ongoing work should stop
         immediately.
    environment:
      commands:
        - dotnet new blazor --interactivity server --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/Recipes.razor'
      - type: file-contains
        config:
          path: '**/Recipes.razor'
          value: CancellationTokenSource
      - type: file-contains
        config:
          path: '**/Recipes.razor'
          value: IAsyncDisposable
      - type: file-contains
        config:
          path: '**/Recipes.razor'
          value: ILogger
      - type: prompt
    rubric:
      - Uses OnParametersSetAsync (not OnInitializedAsync) because the data depends on a route parameter that changes during navigation — guards with a tracked value to skip reloading when only the sort parameter changes
      - Cancels the previous in-flight request when CuisineId changes by cancelling the existing CancellationTokenSource and creating a new one — the token is captured into a local variable BEFORE the await to avoid races with a replaced CTS
      - On the first load (data is null), shows a loading placeholder. On subsequent loads (data already exists), keeps the existing data visible and shows an additional loading indicator — does NOT clear existing data on subsequent loads
      - Catches external OperationCanceledException using 'when (!cancellationToken.IsCancellationRequested)' — this means a timeout or external cancellation that the component did NOT trigger. Self-initiated cancellation (parameter change, disposal) is NOT caught because ComponentBase silently swallows it
      - Catches general Exception separately for non-cancellation errors — both catch blocks log via ILogger and set a user-facing error string that is a hardcoded generic message, NEVER exception.Message (PII risk)
      - Shows a Retry button when an error is set, wired to the load method so the user can attempt the operation again
      - Implements IAsyncDisposable that cancels and disposes the CancellationTokenSource — does NOT catch OperationCanceledException in DisposeAsync because ComponentBase handles self-cancellation automatically
  - name: Real-time shipment tracker with Auto interactivity
    tags:
      capability: fetch-and-send-data
      risk: baseline-misses-fetch-and-send-data-guidance
      journey: real-time-shipment-tracker-with-auto-interactivi
    prompt: |
      I have a Blazor Web App using Auto interactivity mode (per-page). Pages
      may run on Server first, then switch to WebAssembly.

      I need an interactive /shipments/{TrackingNumber} page that tracks a
      package.

      Create a ShipmentService interface with:
      - GetShipmentAsync(string trackingNumber, CancellationToken ct) — returns
        shipment details (TrackingNumber, Status, Location, EstimatedDelivery,
        and a list of StatusUpdate events with timestamps).

      On the server side, implement a concrete ShipmentService that simulates a
      slow backend (Task.Delay(1500, ct)) and returns fake data. Seed data for
      3 tracking numbers.

      Behaviors I need:

      1. When the page loads, fetch the shipment details and display them. While
         loading, show a loading placeholder with the tracking number.

      2. The component should work correctly regardless of whether it's running
         on Server or WebAssembly — the data access pattern must be the same in
         both environments.

      3. If the user navigates to a different tracking number while data is
         loading, cancel the previous load and start fresh for the new tracking
         number.

      4. If something goes wrong — timeout, network error, anything — show the
         user a friendly message and let them retry. If it's a timeout, say so.
         Don't show raw exception details. Log errors through ILogger.

      5. When the user leaves the page, all pending requests must stop
         immediately.
    environment:
      commands:
        - dotnet new blazor --interactivity auto --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/*.Client/**/*.razor'
      - type: file-contains
        config:
          path: '**/*.Client/**/Program.cs'
          value: HttpClient
      - type: file-contains
        config:
          path: '**/*.razor'
          value: CancellationTokenSource
      - type: file-contains
        config:
          path: '**/*.razor'
          value: IAsyncDisposable
      - type: prompt
    rubric:
      - Uses OnParametersSetAsync because the route parameter changes during navigation — cancels previous in-flight requests when TrackingNumber changes
      - Handles errors with user-facing messages and a retry mechanism — logs through ILogger and never displays exception.Message
      - Implements IAsyncDisposable that cancels and disposes the CancellationTokenSource — stops all pending requests on disposal
      - The data access pattern works regardless of execution environment — component depends on an abstraction, not a concrete server-only service
  - name: Static SSR library catalog with slow query and URL state
    tags:
      capability: static-ssr-streaming-query
      risk: blank-page-and-lost-url-state
      journey: load-slow-data-static-ssr
    prompt: |
      I have a Blazor Web App with no interactivity (static server rendering
      only, no render modes anywhere).

      Add a /books page for a library catalog. A BookCatalog service with
      SearchAsync(string? term, int page, CancellationToken cancellationToken)
      simulates a slow database (Task.Delay(3000)) and returns books (Id,
      Title, Author, Year) from seed data. The page should be bookmarkable:
      the search term and page number should live in the URL (?term=...&page=2)
      and be applied when the page is opened from a link or a plain GET form.

      Users shouldn't stare at a blank browser tab for three seconds — the
      page chrome and a "Loading books…" message should appear right away and
      the results should fill in when the query finishes. Default to page 1
      when no page is given.
    environment:
      commands:
        - dotnet new blazor --interactivity none --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/Books.razor'
      - type: file-contains
        config:
          path: '**/Books.razor'
          value: SupplyParameterFromQuery
      - type: file-contains
        config:
          path: '**/Books.razor'
          value: StreamRendering
      - type: file-contains
        config:
          path: '**/Program.cs'
          value: BookCatalog
      - type: prompt
    rubric:
      - The page reads the search term and page number from the query string through query-parameter binding, not from component-only state, and page falls back to 1 when absent
      - Slow data is loaded in an async lifecycle method with streaming enabled for the page so the initial HTML (including a loading message) is flushed before the query completes
      - Does not add an interactive render mode or @rendermode just to get loading UX or query handling; search is done with a plain GET form or links
      - The service is registered in DI on the server and injected directly into the page; the page does not call its own server through HttpClient
      - Shows a loading message while results are null and distinguishes an empty result list from still-loading
  - name: Wasm inventory client with split service and failed save handling
    tags:
      capability: auto-service-abstraction-post
      risk: server-only-service-in-client
      journey: save-data-from-auto-component
    prompt: |
      My Blazor Web App uses Auto interactivity globally, with the usual
      Server project and a .Client project. Pages are prerendered.

      I need an /inventory page with a list of warehouse items (Id, Sku,
      Quantity) and a small form to add a new item. The server project has
      an EF-style data layer (just use an in-memory list behind it) and
      should minimal-API expose GET /api/items and POST /api/items. The POST
      should return a 400 with a problem details body when the Sku already
      exists.

      The page component needs to work no matter which side it is running on.
      When saving, the button must not allow double submits, and if the
      server rejects the item, show the reason the server gave as a friendly
      validation-style message instead of crashing the page. Other unexpected
      failures should show a generic message and be logged.
    environment:
      commands:
        - dotnet new blazor --interactivity auto --interactivity-all --no-https --force
    graders:
      - type: file-contains
        config:
          path: '**/*.Client/Program.cs'
          value: AddHttpClient
      - type: file-contains
        config:
          path: '**/Program.cs'
          value: MapPost
      - type: file-contains
        config:
          path: '**/*.razor'
          value: PostAsJsonAsync
      - type: output-not-matches
        config:
          pattern: (?i)inject\s+\w*DbContext
      - type: prompt
    rubric:
      - The component injects an abstraction (interface or abstract base class) rather than a server-only data class, with one implementation that accesses data directly on the server and another that uses HttpClient in the .Client project, each registered in its own project's Program.cs
      - HttpClient is configured in the client project with a base address that works in the browser, and server-side registration also exists so prerendering resolves the dependency
      - The save uses a POST via HttpClient, checks the response status, and for a rejected response reads the problem details body to show the server-provided reason instead of throwing to the user
      - A saving flag disables the submit button during the request and is reset in a finally block
      - Unexpected exceptions are logged through ILogger and shown as a hardcoded generic message, never the exception Message; the component does not inject a DbContext
  - name: Invoice list persisted across prerender with interactive server
    tags:
      capability: persistent-state-guard
      risk: duplicate-fetch-on-prerender
      journey: avoid-double-load-prerender
    prompt: |
      I have a Blazor Web App with Interactive Server enabled globally. Our
      /invoices page loads data from an InvoiceService.ListAsync(
      CancellationToken) in OnInitializedAsync, and users see the list flash
      and the service gets called twice on every first visit — the log shows
      two hits each time. The call is expensive and we want exactly one on a
      first visit.

      Create the InvoiceService (simulated 1s delay, invoice records with
      Number, Customer, Total) and the /invoices page, and make sure the data
      is fetched only once on first load while still being shown immediately
      once the interactive circuit starts. Include a Loading… state for when
      nothing has arrived yet. Don't turn prerendering off.
    environment:
      commands:
        - dotnet new blazor --interactivity server --interactivity-all --no-https --force
    graders:
      - type: file-exists
        config:
          path: '**/Invoices.razor'
      - type: file-contains
        config:
          path: '**/Invoices.razor'
          value: PersistentState
      - type: file-contains
        config:
          path: '**/Invoices.razor'
          value: '??='
      - type: output-not-matches
        config:
          pattern: (?i)prerender\s*:\s*false
      - type: prompt
    rubric:
      - The invoice collection field or property is marked for state persistence so the prerendered value is restored when the interactive circuit starts
      - The load only calls the service when the persisted value is still null (null-coalescing assignment or equivalent check), so the second lifecycle pass does not refetch
      - Prerendering is left enabled; the fix is not achieved by disabling prerender or by moving the fetch to OnAfterRenderAsync
      - Shows a loading placeholder while the value is null and passes a CancellationToken through to the service rather than calling it without one
